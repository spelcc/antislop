[package]
name = "antislop"
version = "0.1.0"
edition = "2024"
description = "Deterministic writing analysis and corpus fingerprinting"
license = "MIT"
repository = "https://github.com/spelcc/antislop"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
wordfreq = "0.2.3"
wordfreq-model = { version = "0.2.3", features = ["large-fr"] }

[dev-dependencies]
tempfile = "3.20"
